## 1. 文件目的與範圍

### 1.1 目的
建立一套**近即時 (near-real-time)、自動化**的遙測衛星任務排程系統，取代／強化現行
MPSS 之人工與批次排程流程，達成：

- **自動化排程**：MA（任務分析師）僅做結果審查，排程由系統自動產生。
- **動態調整**：可隨時針對**客戶緊急訂單**與**可用地面站資源**進行重排。
- **近即時**：將求解時間自現行約 10 分鐘大幅縮短，支援事件驅動的即時重排。

### 1.2 範圍
| 納入 (In Scope) | 不納入 (Out of Scope) |
| :-- | :-- |
| 任務請求受理、優先度評估 | 衛星飛控軟體 (FSW) 本體修改 |
| 滾動視界排程與衝突解決 | 影像處理與產品生成 (IPS 內部) |
| 指令序列生成、上鏈介面 | 地面站天線硬體控制 |
| 衛星資源 (SSR/電力/Contact) 驗證 | 軌道測定 (OD) 演算法本體 |
| REST API / Webhook 整合 (SOCC↔IPS) | — |

### 1.3 設計準則
1. **資料源可替換**：PSS / 外部系統以 adapter 介面接入，目前以 mock 開發，規格到位即替換。
2. **限制式設定驅動**：硬約束（互斥、Duty Cycle、仰角…）以設定/模型描述，不寫死於流程。
3. **增量重排**：只重排受影響的衛星與時間窗，避免全星系全日重算（對應需求 ReSchedule）。

## 2. 系統需求 (System Requirements)

需求編號規則：`SR-<類別>-<序>`。優先層級：H 高 / M 中 / L 低。

### 2.1 功能需求 (Functional Requirements)

| 編號 | 需求 | 說明 | 優先 |
| :-- | :-- | :-- | :-: |
| SR-REQ-01 | 任務請求受理 | 透過 REST API / Webhook 接收客戶／IPS 任務請求並入佇列 | H |
| SR-REQ-02 | 優先度評估與分類 | 依客戶等級、緊急程度、截止時間自動分級（含緊急插單） | H |
| SR-REQ-03 | 任務佇列管理 | 待排、排程中、已排、已執行、失敗等狀態機管理 | H |
| SR-SCH-01 | 滾動視界排程 | 僅規劃眼前一段視界（如未來 1–2 軌 / 1–2 小時），週期滾動 | H |
| SR-SCH-02 | 衝突偵測 | 偵測衛星、鏈路、天線、地面站、記憶體之同時段衝突 | H |
| SR-SCH-03 | 衝突解決 | 以取消 / 延後 / 改地面站 / 改衛星 / 降級任務自動解決 | H |
| SR-SCH-04 | 快速重排 (ReSchedule) | 因天氣、地面站故障、衛星異常、緊急插單觸發增量重排 | H |
| SR-SCH-05 | 多目標最佳化 | 覆蓋率、延遲、下鏈吞吐、能源、優先度之加權最佳化 | H |
| SR-SCH-06 | 自動建立 Session | 以 X-band Contact 為界，自每日 2 段細分至每日約 15 個 Session | M |
| SR-RES-01 | 資源充足性驗證 API | 供 IPS 驗證 SSR、X-band/S-band Contact、Duty Cycle 是否足夠 | H |
| SR-RES-02 | 能源/電池約束 | 排程須滿足電池電壓門檻與 GOHOME 50 分鐘充電週期 | H |
| SR-RES-03 | SSR 儲存約束 | 依檔案數、sector 數、erase time 計算可行性 | H |
| SR-EXE-01 | 指令序列生成 | 由排程結果生成 MPQ / 指令序列（含成對、不交錯檢查） | H |
| SR-EXE-02 | 上鏈介面 | 將指令序列交付 SOCC 上鏈，回報結果 | H |
| SR-EXE-03 | 衛星狀態監控回饋 | 接收遙測/執行結果，觸發必要重排 | H |
| SR-EXE-04 | AOCS MPQ SEQ 擴充支援 | 支援每日 150 點位拍攝/下載（SEQ ID 256→512） | H |
| SR-INT-01 | SOCC↔IPS RESTful API | 跨網域安全交換資料（GET/POST/PUT/DELETE） | H |
| SR-INT-02 | Webhook 事件通知 | 訂單、重排、告警以事件推送 | H |
| SR-OUT-01 | 排程輸出 | 標準化 JSON 排程檔（可擴充 XML/PSS 格式） | H |
| SR-OUT-02 | 通知 | 排程完成 / 衝突 / 異常以 Email、Slack 發送 | H |
| SR-AI-01 | AI 輔助最佳化 | 以學習式啟發法加速求解、預測雲遮/衝突風險 | M |

### 2.2 非功能需求（摘要，詳見 §11）
| 編號 | 需求 | 目標值 |
| :-- | :-- | :-- |
| SR-NFR-01 | 單次滾動視界求解時間 | ≤ 60 秒（緊急重排 ≤ 10 秒給出可行解） |
| SR-NFR-02 | 緊急訂單端到端響應 | 自受理到產生候選排程 ≤ 2 分鐘 |
| SR-NFR-03 | 可用度 | 排程服務 ≥ 99.5% |
| SR-NFR-04 | 可稽核性 | 所有排程決策、衝突解決留軌跡 |
| SR-NFR-05 | 資安 | 跨網域 API 採 TLS + Token + Access Control |

### 4.4 情境 C — 地面站故障 / 衛星異常重排
```mermaid
sequenceDiagram
    autonumber
    participant MON as 監控(遙測/站況)
    participant SE as 排程引擎
    participant SE2 as 衝突解決器
    participant EX as 執行層
    MON->>SE: 事件: 地面站X離線 / 衛星ARO
    SE->>SE: 標記受影響 Pass/Activity
    SE->>SE2: 對受影響視界重排
    SE2->>SE2: 改站/改衛星/延後/降級
    SE2-->>SE: 新可行排程
    SE->>EX: 覆寫指令, 通知相關方
```

> 實作：`POST /api/v1/events`（`station_offline` / `satellite_anomaly`）。
> 站離線 → 移除站資源、未執行接觸改站重排；衛星異常 → 暫停該星全部未執行活動，
> 他星不受影響。皆走 §8.3 增量重排管線（凍結近端 + 暖啟動）。

### 4.5 情境 D — 雲覆蓋作廢重拍
```mermaid
sequenceDiagram
    autonumber
    participant CLD as 雲圖/品質判定(IPS)
    participant API as 事件 API
    participant SE as 排程引擎
    participant NT as 通知
    CLD->>API: POST /api/v1/events {cloud_cover, 受影響取像}
    API->>SE: 作廢受影響 RSI_REC + 下游 PBK/DEL
    SE->>SE: 重拍提升優先度, 增量重排(§8.3)
    SE-->>API: diff (cancelled/added/removed)
    API->>NT: ☁️ 雲覆蓋作廢重拍 通知
```

雲覆蓋超標的取像即使已執行，影像不可用：系統作廢該 REC 與同 `arlentryid`
的下游回放/刪除，將重拍活動優先度提升後立即增量重排，於下一可行時窗重新取像。

## 5. 系統架構 (System Architecture)

### 5.1 三層邏輯架構（依官方 系統架構.pptx，對應未來需求第 6 項）

```mermaid
flowchart LR
    CLI[客戶 / IPS]:::ext

    subgraph REQ[Request Layer 請求層]
        direction TB
        ORD[Orders]
        RX[事件接收器]

    classDef ext fill:#eef,stroke:#557;
    class CLI,EV,SAT ext;
```

## 9. 關鍵技術概念（滾動視界 / OR-Tools / AI）

### 9.1 滾動視界排程器 (Rolling Horizon Scheduler)
傳統排程一次規劃「所有未來」（如整週生產計畫），但太空環境隨時變動、未來資訊不準。
**滾動視界**採「且戰且走」：只規劃眼前一小段**視界 (Horizon)**（如未來 1 小時 / 2 軌），
執行一部分後，視界向前滾動 Δt 再重排。優點：

- **吸收不確定性**：雲遮、站況、緊急插單都在下一次滾動被納入。
- **計算可控**：每次只解小問題，符合近即時時限。
- **天然支援 ReSchedule**：只重排受影響視界，不必全星系全日重算。

參數：視界長度 `H`、滾動步長 `Δt`、凍結區 `freeze`（近端已上鏈不可改）。

### 9.2 Google OR-Tools (CP-SAT)
以**約束規劃 / 可滿足性 (CP-SAT)** 建模本問題最自然：活動為帶起訖時間的區間變數，
互斥以 `NoOverlap`、資源以 `Cumulative`、順序以線性不等式表達，多目標以加權或字典序。
詳見 §10。OR-Tools 提供暖啟動 (hint)、時間上限 (max_time_in_seconds)，契合滾動視界與緊急重排。

### 9.3 AI 優化定位
| AI 角色 | 作用 | 與 OR-Tools 關係 |
| :-- | :-- | :-- |
| 啟發式暖啟動 | 由歷史排程學出好的初始解作 hint | 加速 CP-SAT 收斂 |
| 風險預測 | 預測雲遮、衝突、資源耗盡機率 | 調整目標權重/提前避讓 |
| 參數自適應 | 依負載動態調 H、Δt、權重 | 控制求解時間 vs 品質 |

> 技術演進路線：**精確求解 → 快速近似 → 自適應學習**，計算速度大幅提升以支援近即時。

## 10. 排程最佳化模型 (OR-Tools 限制式)

### 10.1 決策變數
- 對每個候選活動 `a`：起始 `start_a`、結束 `end_a`、是否排入 `present_a`（OptionalInterval）。
- 站點指派 `site_a ∈ {可見地面站}`（RSI_PBK 至多一站）。

### 10.2 硬約束（取自限制條件表，須全部滿足）

| # | 約束 | 模型化 | 來源 |
| :-- | :-- | :-- | :-- |
| C1 | 活動互斥矩陣（Attitude/Orbit/GOHOME/GAT/RSI_REC/RSI_PBK 彼此不重疊） | `AddNoOverlap` | 互斥矩陣 |
| C2 | 同類活動自身不重疊 | `AddNoOverlap` | 資源衝突 #18 |
| C3 | RSI_REC ≤ 8 min/軌（Duty Cycle） | 區間長度上界 + 每軌累積 | Duty #10 |
| C4 | RSI_PBK ≤ 10 min/軌 | 同上 | Duty #11 |
| C5 | GOHOME 間隔 ≤ 50 min（充電） | 相鄰 GOHOME 起點差 ≤ 50min | Duty #12 |
| C6 | RSI_PBK 須在 X-band 仰角 ≥ 11.5° 視窗內 | 區間 ⊆ 可見窗集合 | Duty #13 |
| C7 | SPL 須 Eclipse 且 S-band 仰角 ≥ 10° | 區間 ⊆ Eclipse∩Sband 窗 | Duty #14 / 活動表 |
| C8 | 兩取像間隔 ≥ 26 s | 相鄰 REC 間隔下界 | 時序 #1 |
| C9 | 機動後 +30s 緩衝才取像 | 順序 + lag | 時序 #2 |
| C10 | RSI_PBK 須待同 arlentryid 之 REC 完成 | `end_REC ≤ start_PBK` | 活動表 20 |
| C11 | RSI_DEL = 對應 PBK contact + 6s，且待 REC+PBK 完成 | 等式 + 順序 | 活動表 26/27 |
| C12 | 一個地面站同時段只服務一顆衛星（+turnaround） | 站資源 `Cumulative(cap=1)` | 資源衝突 #19 |
| C13 | SSR 容量：所需 sector ≤ 可用；最多 512 檔；同時讀寫各 6 | `Cumulative` + 計數 | SSR #20/#24 |
| C14 | 電池電壓不得低於門檻（27.8V 關 Payload / 26.4V ARO） | 能量收支模擬約束 | EPS 限制 |
| C15 | 指令成對且不交錯（STX/EU/SSR/CC On-Off） | 配對 + 排序約束 | 指令 #26 |

> 所需 sector 數：`Required = ceil(Total_bit / (128 × 2^20))`。Erase time ≈ `sector × 0.007s`（4096 sectors ≈ 286.7s），列為時序不確定性緩衝。

### 10.3 多目標（軟目標，加權最佳化）
```
maximize  w1·覆蓋率 + w2·下鏈吞吐
minimize  w3·任務完成延遲 + w4·能源消耗 + w5·優先度違反
```
- 高優先度/緊急訂單以大權重或字典序優先。
- 滾動視界中以 `solver.parameters.max_time_in_seconds` 控制求解時限；緊急重排用更短時限 + 暖啟動。

### 10.4 求解策略
1. 以上一視界排程為 **hint**（暖啟動）。
2. 凍結近端已上鏈活動（固定變數）。
3. 先求可行解（滿足硬約束），再於剩餘時間內優化軟目標。
4. 無可行解 → 觸發 §8.2 衝突解決（改站/延後/改星/降級）。

### 10.5 數學模型正式化（限制式 (1)–(66)，對應活動限制明細）

**集合與索引**

| 符號 | 意義 |
| :-- | :-- |
| `A` | 候選活動集合；`a ∈ A` 帶型別 τ(a)、衛星 sat(a)、時長 d_a、優先權 w_a |

**目標函數**

```
max  Σ_{a∈A} w_a · x_a          w_a：routine=10, high=50, urgent=500（雲覆蓋重拍 ≥100）
```

> CP-SAT 實作對照：互斥 → 分組 `NoOverlap`；窗容納 → 指示變數 + `OnlyEnforceIf`；
> Duty → 線性和上界；SSR → `AddReservoirConstraintWithActive`；站資源 → `Cumulative(cap_g)`。

## 11. 非功能需求與資安

| 面向 | 需求 |
| :-- | :-- |
| 效能 | 視界求解 ≤ 60s；緊急重排 ≤ 10s 給可行解；目標優於現行 ~10min |
| 擴充性 | 引擎 worker 可水平擴充；支援多衛星多地面站 |
| 可靠性 | 求解逾時有 fallback（上一可行解）；佇列持久化 |
| 可稽核 | 排程決策、衝突解決、覆寫皆留軌跡（誰/何時/為何） |
| 資安 | TLS、Bearer Token、Access Control（對應 XPSOC Python Directive/Command 權限管控）；SOCC↔IPS 跨網域最小權限 |
| 可觀測 | 指標（求解時間、衝突率、資源使用）、日誌、告警 |

## 12. 開發路線圖

```mermaid
graph LR
    P1[Phase 1\n骨架+mock\n端到端 JSON] --> P2[Phase 2\nOR-Tools 核心約束\nC1-C7]
    P2 --> P3[Phase 3\n資源模型\nSSR/電力/Contact]
    P3 --> P4[Phase 4\n滾動視界+ReSchedule\nWebhook 事件驅動]
    P4 --> P5[Phase 5\nSOCC↔IPS API 整合]
    P5 --> P6[Phase 6\nAI 暖啟動/風險預測]
    P6 --> P7[Phase 7\n情境演練+試運轉]
```

> **進度**：
> - ✅ **Phase 1 骨架**：請求層 webhook、PSS adapter、簡化排程引擎、JSON 輸出、Email/Slack 通知、測試。
> - ✅ **Phase 2 OR-Tools 核心**：`scheduler/cpsat.py` 以 CP-SAT 實作硬約束 **C1–C7**
>   （互斥 NoOverlap、RSI_REC/PBK Duty Cycle、GOHOME 50min 充電、X-band/Eclipse 可見窗），
>   活動式模型於 `activity_models.py`，示範 `demo_cpsat.py`，測試 `tests/test_cpsat.py` 逐條驗證。
> - ✅ **滾動視界外框**：`scheduler/rolling.py` 實作 §8.1 主迴圈（視界/步長/凍結、
>   跨視界 carry-over）與 §8.3 緊急增量重排（凍結近端 + 暖啟動 + 差異 diff），
>   示範 `demo_rolling.py`，測試 `tests/test_rolling.py`。緊急插單增量求解 ~15ms。
> - ✅ **事件驅動端到端**：`service.py`（`SchedulingService` 狀態管理）+ `trigger/event.py`
>   （FastAPI：`POST /api/v1/orders`、`/schedule/run`、`/resources/verify`、`GET /schedule`）。
>   緊急訂單即時觸發增量重排（~14ms），routine 入佇列待滾動排程；含事件流通知掛勾。
>   示範 `demo_service.py`，測試 `tests/test_service.py`。共 23 測試全過。
> - ✅ **Phase 3 C8–C12、C15**：`scheduler/cpsat.py` 加入取像間隔 ≥26s（加長區間 NoOverlap）、
>   機動後 +30s 緩衝（成對順序）、`arlentryid` 順序相依 REC→PBK→DEL（C10/C11）、
>   地面站資源 +turnaround（C12，NoOverlap/Cumulative）、指令成對不交錯（C15，同設備 span NoOverlap）。
>   測試 `tests/test_phase3.py`、`tests/test_phase3b.py`，共 38 測試全過。
> - ✅ **PSS 活動式介面對齊**：`pss/provider.py` 的 `PSSProvider.fetch_context()` → `PSSContext`
>   （軌道、地面站、X-band/S-band/Eclipse 可見窗）。`SchedulingService.from_pss()` 自動指派軌道、套可見窗。
> - ✅ **多衛星擴充**：互斥（C1/C2）、Duty Cycle、GOHOME、取像間隔、機動緩衝、指令配對皆「按衛星分組」
>   （`Activity.satellite`）；地面站（C12）為跨衛星共用資源，天線數 >1 時不同衛星接觸可同時段並行。
>   測試 `tests/test_multisat.py`，共 48 測試全過。
> - ✅ **互斥矩陣精確化**：C1/C2 由「全域互斥」改為依官方活動限制明細之互斥矩陣分組
>   （MONITORING/SPL/DEL 互斥集合較窄，可與取像等並行，提升排程容量）。
> - ✅ **C13 SSR**：sector 容量 + 檔案數上限（Reservoir，REC 佔用 / DEL 釋放）；
>   SPL_PBK 待 SPL_PRO（限制式 62）；STX 開機 ≤16 min（FM_XTX*_TIMEOUT）。
> - ✅ **緊急事件流程**：`POST /api/v1/events` 處理雲覆蓋（作廢重拍）/ 地面站離線（改站）/
>   衛星異常（暫停該星），共用 §8.3 增量重排管線（§4.4/§4.5）。
> - ⏭️ **下一步**：C14 電力收支（需 EPS 充放電模型）。接真 PSS API
>   （補 `RestPSSProvider.fetch_context()`）。FPA 指令禁止期 7.5s/25s 矛盾待 FSW 確認。
